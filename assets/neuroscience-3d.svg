<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Three-dimensional neural brain illustration</title>
<desc id="desc">A luminous violet and cyan 3D-style brain formed from neural pathways, synapses, and glowing connections against a deep navy scientific background.</desc>
<defs>
