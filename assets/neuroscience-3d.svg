<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Maanya Tyagi — Living 3D Neural Network</title>
<desc id="desc">An animated three-dimensional neural network with layered neuron nodes, glowing synaptic connections, and signal pulses travelling between neurons.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#10183c"/><stop offset="1" stop-color="#042b3a"/></linearGradient>
 <linearGradient id="wire"><stop stop-color="#6366f1" stop-opacity=".12"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
 <radialGradient id="sphere" cx="30%" cy="24%"><stop stop-color="#fff"/><stop offset=".2" stop-color="#a5f3fc"/><stop offset=".58" stop-color="#6366f1"/><stop offset="1" stop-color="#171554"/></radialGradient>
 <radialGradient id="aura"><stop stop-color="#4f46e5" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#67e8f9" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1500" height="760" rx="28" fill="url(#bg)"/><rect width="1500" height="760" rx="28" fill="url(#grid)"/>
<ellipse cx="750" cy="340" rx="570" ry="330" fill="url(#aura)"><animate attributeName="opacity" values=".45;1;.45" dur="6s" repeatCount="indefinite"/></ellipse>
<g fill="none" stroke="#22d3ee" stroke-opacity=".25"><ellipse cx="750" cy="340" rx="530" ry="205" transform="rotate(-18 750 340)"><animateTransform attributeName="transform" type="rotate" values="-18 750 340;342 750 340" dur="48s" repeatCount="indefinite"/></ellipse><ellipse cx="750" cy="340" rx="500" ry="235" transform="rotate(55 750 340)"><animateTransform attributeName="transform" type="rotate" values="55 750 340;415 750 340" dur="58s" repeatCount="indefinite"/></ellipse></g>
<!-- layered depth planes -->
<g id="network" transform="translate(750 335)">
 <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1.5 0 0;1.5 0 0;-1.5 0 0" dur="12s" repeatCount="indefinite"/>
 <g transform="scale(1 .78)">
  <g fill="none" stroke="url(#wire)" stroke-width="2.5">
   <path id="edge1" d="M-470 -100 Q-260 -250 -90 -70 T270 -130 T470 40"/>
   <path id="edge2" d="M-470 100 Q-260 240 -90 70 T270 130 T470 -40"/>
   <path id="edge3" d="M-350 -220 Q-180 0 0 -160 T350 220"/>
   <path id="edge4" d="M-350 220 Q-180 0 0 160 T350 -220"/>
   <path id="edge5" d="M-470 -100 Q-220 20 0 0 T470 40"/>
   <path id="edge6" d="M-470 100 Q-210 -30 0 0 T470 -40"/>
   <path id="edge7" d="M-90 -70 Q0 -260 90 -70 Q180 0 90 70 Q0 260 -90 70 Q-180 0 -90 -70"/>
   <path id="edge8" d="M-350 -220 Q-120 -90 0 0 Q120 90 350 220"/>
   <path id="edge9" d="M-350 220 Q-120 90 0 0 Q120 -90 350 -220"/>
  </g>
  <g fill="#ecfeff" filter="url(#glow)">
   <circle r="7"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#edge1"/></animateMotion></circle>
   <circle r="6"><animateMotion dur="4.1s" begin=".7s" repeatCount="indefinite"><mpath href="#edge2"/></animateMotion></circle>
   <circle r="6"><animateMotion dur="3.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#edge3"/></animateMotion></circle>
   <circle r="7"><animateMotion dur="4.5s" begin=".4s" repeatCount="indefinite"><mpath href="#edge4"/></animateMotion></circle>
   <circle r="5"><animateMotion dur="2.9s" begin="1.6s" repeatCount="indefinite"><mpath href="#edge5"/></animateMotion></circle>
   <circle r="5"><animateMotion dur="3.2s" begin=".9s" repeatCount="indefinite"><mpath href="#edge6"/></animateMotion></circle>
   <circle r="5"><animateMotion dur="3.7s" begin=".2s" repeatCount="indefinite"><mpath href="#edge7"/></animateMotion></circle>
   <circle r="5"><animateMotion dur="4.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#edge8"/></animateMotion></circle>
   <circle r="5"><animateMotion dur="4s" begin="1.8s" repeatCount="indefinite"><mpath href="#edge9"/></animateMotion></circle>
  </g>
  <g fill="url(#sphere)" stroke="#a5f3fc" stroke-width="2" filter="url(#glow)">
   <circle cx="-470" cy="-100" r="25"/><circle cx="-470" cy="100" r="22"/><circle cx="-350" cy="-220" r="19"/><circle cx="-350" cy="220" r="20"/>
   <circle cx="-90" cy="-70" r="31"/><circle cx="-90" cy="70" r="27"/><circle cx="0" cy="-160" r="22"/><circle cx="0" cy="0" r="43"/>
   <circle cx="0" cy="160" r="23"/><circle cx="90" cy="-70" r="29"/><circle cx="90" cy="70" r="28"/><circle cx="270" cy="-130" r="24"/>
   <circle cx="270" cy="130" r="25"/><circle cx="350" cy="-220" r="18"/><circle cx="350" cy="220" r="20"/><circle cx="470" cy="40" r="27"/><circle cx="470" cy="-40" r="23"/>
  </g>
  <g fill="none" stroke="#cffafe" stroke-width="2" filter="url(#glow)">
   <circle cx="0" cy="0" r="56"><animate attributeName="r" values="48;70;48" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.12;.8" dur="3.5s" repeatCount="indefinite"/></circle>
   <circle cx="-90" cy="-70" r="42"><animate attributeName="r" values="35;49;35" dur="4s" repeatCount="indefinite"/></circle>
   <circle cx="90" cy="70" r="39"><animate attributeName="r" values="32;47;32" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
 </g>
</g>
<g fill="#a5f3fc" filter="url(#glow)"><circle cx="250" cy="170" r="4"><animate attributeName="cy" values="170;210;170" dur="5s" repeatCount="indefinite"/></circle><circle cx="1240" cy="230" r="5"><animate attributeName="cx" values="1240;1200;1240" dur="6s" repeatCount="indefinite"/></circle><circle cx="310" cy="540" r="5"><animate attributeName="cx" values="310;350;310" dur="4.8s" repeatCount="indefinite"/></circle><circle cx="1160" cy="560" r="4"><animate attributeName="cy" values="560;520;560" dur="5.2s" repeatCount="indefinite"/></circle></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><text x="750" y="655" fill="#cffafe" font-size="30" letter-spacing="7">NEURAL NETWORK · SIGNAL PROPAGATION</text><text x="750" y="694" fill="#94a3b8" font-size="16" letter-spacing="4">NEUROSCIENCE × COMPUTATIONAL MODELLING × AI</text><text x="750" y="735" fill="#64748b" font-size="12" letter-spacing="3">A LIVING VISUAL OF CONNECTED INTELLIGENCE</text></g>
</svg>